name: Build and Release

on:
  push:
    tags:
      - release*

  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  RABBY_PROD_BUCKET: rabby-fe
  CI: true

jobs:
  build-and-release:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js v22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      # Use the yarn version (and hash) pinned by `packageManager` in package.json via corepack,
      # instead of a floating global `npm install -g yarn`.
      - name: Enable corepack
        run: |
          corepack enable
          yarn --version

      - name: Build source code
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Copy dists to s3
        run: |
          aws s3 sync . s3://${RABBY_PROD_BUCKET}/ --delete
          aws cloudfront create-invalidation --distribution-id E1LJA4J5XV5BB --paths '/*'
        working-directory: dist
